<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="frame">

        <div class="calculator-body">

            <div class="solar-charge"></div>
            <div class="logo">Expert</div>

            <div class="button-body">
                
                <div class="screen"></div>
                <button class="button-clear key" data-value="AC">AC</button>
                <button class="button-percent key" data-value="%">%</button>
                <button class="button-divide key" data-value="/">÷</button>
                <button class="button-multiply key" data-value="*">×</button>
                <button class="button-seven key" data-value="7">7</button>
                <button class="button-eight key" data-value="8">8</button>
                <button class="button-nine key" data-value="9">9</button>
                <button class="button-minus key" data-value="-">-</button>
                <button class="button-four key" data-value="4">4</button>
                <button class="button-five key" data-value="5">5</button>
                <button class="button-six key" data-value="6">6</button>
                <button class="button-plus key" data-value="+">+</button>
                <button class="button-one key" data-value="1">1</button>
                <button class="button-two key" data-value="2">2</button>
                <button class="button-three key" data-value="3">3</button>
                <button class="button-equal key" data-value="=">=</button>
                <button class="button-zero key" data-value="0">0</button>
                <button class="button-dot key" data-value=".">.</button>
            </div>

        </div>    

    </div>

</body>
</html>
